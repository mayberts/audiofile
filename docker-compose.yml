services:
  backend:
    image: ghcr.io/mayberts/audiofile-backend:latest
    container_name: audiofile-backend
    restart: unless-stopped
    environment:
      MUSICBRAINZ_CONTACT: ${MUSICBRAINZ_CONTACT}
      DOWNLOAD_DIR: /downloads
      LIBRARY_DIR: /music
      DATABASE_URL: sqlite:////data/audiofile.db
    volumes:
      # Must point at the same host folder your existing slskd container
      # downloads into — see README for how to find it.
      - ${HOST_DOWNLOADS_DIR:-./data/downloads}:/downloads
      - ${HOST_LIBRARY_DIR:-./data/music}:/music
      # Holds the SQLite database (wanted list, download history) and the
      # settings.json the Settings page writes to — back this up.
      - ${HOST_APPDATA_DIR:-./data/appdata}:/data
    ports:
      - "8000:8000"
    # Lets the container reach a slskd instance published on the host via
    # http://host.docker.internal:<port> (works on Docker Desktop out of the
    # box; this extra_hosts entry makes it resolve on Linux too).
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    image: ghcr.io/mayberts/audiofile-frontend:latest
    container_name: audiofile-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
