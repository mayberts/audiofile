server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Safety net only — long-running work (e.g. the Plex gap scan) runs
        # as a background task and returns immediately; nothing should
        # normally take anywhere near this long.
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri /index.html;
    }
}
