server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The manual Soulseek search endpoint (POST /api/search) blocks for
        # up to ~130s worst case by design — SearchRequest.timeout_ms
        # defaults to 120000, matching services/wanted.py's own
        # _FIRST_RUNG_TIMEOUT_MS (a shorter budget was tried and found to
        # give up well before slskd finishes gathering results for
        # heavily-shared content). Long-running work like the Plex gap scan
        # is unaffected — it runs as a background task and returns
        # immediately — but this value has to comfortably clear the
        # search endpoint's own worst case or nginx kills the connection
        # right as real results are about to come back.
        proxy_read_timeout 160s;
    }

    location / {
        try_files $uri /index.html;
    }
}
